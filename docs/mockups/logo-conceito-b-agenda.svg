<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 180" width="560" height="180">
  <defs>
    <linearGradient id="gB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="560" height="180" fill="#ffffff"/>
  <text x="40" y="26" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Conceito B — Agenda (calendário com horário marcado, autoexplicativo)</text>

  <!-- tile -->
  <rect x="40" y="44" width="96" height="96" rx="24" fill="url(#gB)"/>
  <!-- argolas do calendário -->
  <rect x="76" y="58" width="5" height="14" rx="2.5" fill="#ffffff"/>
  <rect x="95" y="58" width="5" height="14" rx="2.5" fill="#ffffff"/>
  <!-- corpo do calendário -->
  <rect x="62" y="66" width="52" height="44" rx="9" fill="#ffffff"/>
  <rect x="62" y="66" width="52" height="11" rx="5" fill="#6366f1"/>
  <!-- grade de horários: um slot em destaque = agendamento -->
  <rect x="70" y="84" width="10" height="10" rx="2.5" fill="#6366f1"/>
  <rect x="83" y="84" width="10" height="10" rx="2.5" fill="#c7d2fe"/>
  <rect x="96" y="84" width="10" height="10" rx="2.5" fill="#c7d2fe"/>
  <rect x="70" y="96" width="10" height="10" rx="2.5" fill="#c7d2fe"/>
  <rect x="83" y="96" width="10" height="10" rx="2.5" fill="#6366f1"/>
  <rect x="96" y="96" width="10" height="10" rx="2.5" fill="#c7d2fe"/>

  <!-- wordmark -->
  <text x="160" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#0f172a">
    Studio<tspan fill="#6366f1">Flow</tspan>
  </text>
  <text x="162" y="124" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Gestão para salões, estética e barbearias</text>
</svg>
