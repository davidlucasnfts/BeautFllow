<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 180" width="560" height="180">
  <defs>
    <linearGradient id="gA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="560" height="180" fill="#ffffff"/>
  <text x="40" y="26" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Conceito A — Fluxo (traço contínuo, sugere agilidade e movimento)</text>

  <!-- tile -->
  <rect x="40" y="44" width="96" height="96" rx="24" fill="url(#gA)"/>
