<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 180" width="560" height="180">
  <defs>
    <linearGradient id="gC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="560" height="180" fill="#ffffff"/>
  <text x="40" y="26" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Conceito C — Monograma SF (minimalista, estilo "tech premium")</text>

  <!-- monograma SF entrelaçado -->
  <text x="46" y="118" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" fill="#0f172a">S</text>
  <text x="92" y="118" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" fill="#6366f1">F</text>
  <!-- sublinhado de fluxo -->
  <path d="M50 136 C 75 144, 105 128, 132 136" fill="none" stroke="url(#gC)" stroke-width="6" stroke-linecap="round"/>

  <!-- wordmark -->
  <text x="190" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#0f172a">
    Studio<tspan fill="#6366f1">Flow</tspan>
  </text>
  <text x="192" y="124" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Gestão para salões, estética e barbearias</text>
</svg>
